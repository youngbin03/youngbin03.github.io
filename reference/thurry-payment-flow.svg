<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1160 700" width="1160" height="700" role="img" aria-labelledby="t d">
<title id="t">떠리 결제 파이프라인</title>
<desc id="d">구매자·앱·서버·토스페이먼츠 4개 주체의 결제 흐름. 전액할인 0원 결제는 PG 승인 구간만 건너뛰고 예약 생성부터는 유료 결제와 같은 경로를 지납니다.</desc>
<defs>
  <marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
    <path d="M0 0.5L9 5L0 9.5z" fill="#C4CAD2"/>
  </marker>
  <marker id="arb" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
    <path d="M0 0.5L9 5L0 9.5z" fill="#3182F6"/>
  </marker>
</defs>
<style>
  .h1{font:800 30px Pretendard,-apple-system,system-ui,sans-serif;fill:#191F28}
  .sub{font:400 15px Pretendard,-apple-system,system-ui,sans-serif;fill:#8B95A1}
  .lane{font:700 15px Pretendard,-apple-system,system-ui,sans-serif;fill:#191F28}
  .msg{font:500 14px Pretendard,-apple-system,system-ui,sans-serif;fill:#4E5968}
  .bl{font:700 14px Pretendard,-apple-system,system-ui,sans-serif;fill:#3182F6}
  .bx{font:700 18px Pretendard,-apple-system,system-ui,sans-serif;fill:#1B64DA}
  .bxc{font:500 13px Pretendard,-apple-system,system-ui,sans-serif;fill:#3182F6}
  .foot{font:500 14px Pretendard,-apple-system,system-ui,sans-serif;fill:#4E5968}
  .life{stroke:#E5E8EB;stroke-width:2;stroke-dasharray:2 6}
  .a{stroke:#C4CAD2;stroke-width:1.8;marker-end:url(#ar)}
</style>

<rect width="1160" height="700" fill="#FFFFFF"/>

<text class="h1" x="60" y="58">떠리 결제 로직</text>
<text class="sub" x="60" y="86">전액할인(0원)만 PG 승인 구간을 건너뛰고, 나머지는 같은 경로를 지납니다</text>

<rect x="72" y="122" width="116" height="38" rx="19" fill="#F2F4F6"/>
<text class="lane" x="130" y="147" text-anchor="middle">구매자</text>
<rect x="352" y="122" width="96" height="38" rx="19" fill="#F2F4F6"/>
<text class="lane" x="400" y="147" text-anchor="middle">앱</text>
<rect x="642" y="122" width="96" height="38" rx="19" fill="#F2F4F6"/>
<text class="lane" x="690" y="147" text-anchor="middle">서버</text>
<rect x="916" y="122" width="168" height="38" rx="19" fill="#F2F4F6"/>
<text class="lane" x="1000" y="147" text-anchor="middle">토스페이먼츠</text>

<line class="life" x1="130" y1="172" x2="130" y2="640"/>
<line class="life" x1="400" y1="172" x2="400" y2="640"/>
<line class="life" x1="690" y1="172" x2="690" y2="640"/>
<line class="life" x1="1000" y1="172" x2="1000" y2="640"/>

<rect x="620" y="410" width="470" height="96" rx="14" fill="#F7FAFF" stroke="#3182F6" stroke-width="1.4" stroke-dasharray="6 5"/>
<text class="bl" x="1090" y="400" text-anchor="end">0원 결제는 이 구간만 건너뜁니다</text>

<text class="msg" x="265" y="204" text-anchor="middle">결제 요청</text>
<line class="a" x1="136" y1="214" x2="394" y2="214"/>

<text class="msg" x="700" y="244" text-anchor="middle">결제창 호출</text>
<line class="a" x1="406" y1="254" x2="994" y2="254"/>

<text class="msg" x="565" y="284" text-anchor="middle">결제 수단 인증</text>
<line class="a" x1="994" y1="294" x2="136" y2="294"/>

<text class="msg" x="700" y="324" text-anchor="middle">successUrl 이동 · paymentKey 전달</text>
<line class="a" x1="994" y1="334" x2="406" y2="334"/>

<text class="msg" x="545" y="374" text-anchor="middle">승인 요청</text>
<line class="a" x1="406" y1="384" x2="684" y2="384"/>

<text class="msg" x="845" y="428" text-anchor="middle">승인 API 요청</text>
<line class="a" x1="696" y1="438" x2="994" y2="438"/>

<text class="msg" x="845" y="472" text-anchor="middle">승인 결과</text>
<line class="a" x1="994" y1="482" x2="696" y2="482"/>

<rect x="530" y="528" width="320" height="70" rx="16" fill="#E8F0FE"/>
<text class="bx" x="690" y="556" text-anchor="middle">예약 생성 · 재고 차감</text>
<text class="bxc" x="690" y="578" text-anchor="middle">승인에 성공했을 때만 실행</text>

<text class="msg" x="410" y="624" text-anchor="middle">예약 완료 응답</text>
<line class="a" x1="684" y1="634" x2="136" y2="634"/>

<line x1="60" y1="662" x2="1100" y2="662" stroke="#E5E8EB" stroke-width="1"/>
<text class="foot" x="60" y="686">결제 수단이 늘어도 예약·환불 로직은 한 벌로 유지됩니다</text>
</svg>
